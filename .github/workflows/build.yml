name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip
      - name: Install Buildozer
        run: |
          pip install buildozer
      - name: Fix aidl path
        run: |
          AIDL_PATH=$(find / -name aidl -type f 2>/dev/null | head -1)
          if [ -n "$AIDL_PATH" ]; then
            sudo ln -sf $AIDL_PATH /usr/local/bin/aidl
            echo "AIDL found and linked"
          else
            echo "AIDL not found, skipping"
          fi
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parastar-apk
          path: bin/*.apk
